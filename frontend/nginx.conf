server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml+rss;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Handle BlueLight viewer with special headers
    location /bluelight/ {
        # Allow framing for BlueLight (override global X-Frame-Options)
        add_header X-Frame-Options SAMEORIGIN;
        # Add CORS headers for BlueLight
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        
        try_files $uri $uri/ @bluelight_fallback;
    }
    
    # Handle BlueLight start.html with query parameters
    location ~ ^/bluelight/html/start\.html$ {
        add_header X-Frame-Options SAMEORIGIN;
        add_header Access-Control-Allow-Origin *;
        
        # Preserve query parameters
        try_files $uri =404;
    }
    
    location @bluelight_fallback {
        # Allow framing for BlueLight fallback
        add_header X-Frame-Options SAMEORIGIN;
        add_header Access-Control-Allow-Origin *;
        
        # If BlueLight file doesn't exist, try without trailing slash or serve start.html
        try_files /bluelight/html/start.html =404;
    }

    # Handle React Router (must come after specific routes)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}