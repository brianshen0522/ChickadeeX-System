services:
  # PostgreSQL Database
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT}:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for session storage
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Keycloak for SSO
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: ${KEYCLOAK_DB_SCHEMA}
      KC_HOSTNAME: ${KEYCLOAK_HOST_IP:-localhost}
      KC_HTTP_PORT: ${KEYCLOAK_HTTP_PORT:-8080}
    command: start-dev --import-realm
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8080}:8080"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./keycloak/realm-medical-reports.json:/opt/keycloak/data/import/realm-medical-reports.json:ro

  # One-shot configurator to set sslRequired=NONE on master realm at startup
  keycloak-configurator:
    image: quay.io/keycloak/keycloak:26.3.3
    depends_on:
      - keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${REACT_APP_KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      FRONTEND_URL: http://${FRONTEND_HOST_IP}:${FRONTEND_PORT}
      BACKEND_URL: http://${HOST_IP}:${BACKEND_PORT}
    entrypoint: ["/bin/sh", "/opt/keycloak-config/configure-ssl.sh"]
    networks:
      - app-network
    restart: "on-failure:5"
    volumes:
      - ./keycloak/configure-ssl.sh:/opt/keycloak-config/configure-ssl.sh:ro

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_INTERNAL_URL: http://keycloak:${KEYCLOAK_HTTP_PORT:-8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      PUBLIC_PROTOCOL: ${PUBLIC_PROTOCOL}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN}
      AUTH_COOKIE_MAX_AGE: ${AUTH_COOKIE_MAX_AGE}
      CORS_ORIGIN: http://${FRONTEND_HOST_IP}:${FRONTEND_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE}
      UPLOAD_ALLOWED_TYPES: ${UPLOAD_ALLOWED_TYPES}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT}
    ports:
      - "${BACKEND_PORT}:3000"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_BLUELIGHT_BASE_URL: ${REACT_APP_BLUELIGHT_BASE_URL}
        REACT_APP_KEYCLOAK_URL: ${REACT_APP_KEYCLOAK_URL}
        REACT_APP_KEYCLOAK_REALM: ${REACT_APP_KEYCLOAK_REALM}
        REACT_APP_KEYCLOAK_CLIENT_ID: ${REACT_APP_KEYCLOAK_CLIENT_ID}
        REACT_APP_PUBLIC_PROTOCOL: ${REACT_APP_PUBLIC_PROTOCOL}
        REACT_APP_PUBLIC_HOSTNAME: ${REACT_APP_PUBLIC_HOSTNAME}
        REACT_APP_KEYCLOAK_PORT: ${REACT_APP_KEYCLOAK_PORT}
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: lscr.io/linuxserver/nginx:latest
    container_name: nginx
    environment:
      - PUID=${DOCKER_PUID}
      - PGID=${DOCKER_PGID}
      - TZ=${DOCKER_TZ}
      - NGINX_AUTORELOAD= #optional
      - NGINX_AUTORELOAD_WATCHLIST= #optional
    volumes:
      - ./nginx_config:/config
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    networks:
      - app-network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
