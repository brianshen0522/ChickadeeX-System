services:
  # PostgreSQL Database
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: medical_reports
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medical_reports"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for session storage
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redis123
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Keycloak for SSO
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/medical_reports
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres123
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 8080
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./keycloak/realm-medical-reports.json:/opt/keycloak/data/import/realm-medical-reports.json:ro

  # One-shot configurator to set sslRequired=NONE on master realm at startup
  keycloak-configurator:
    image: quay.io/keycloak/keycloak:26.3.3
    depends_on:
      - keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KEYCLOAK_REALM: medical-reports
      KEYCLOAK_CLIENT_ID: medical-reports-client
      KEYCLOAK_CLIENT_SECRET: dev-secret
      FRONTEND_URL: http://localhost:3001
      BACKEND_URL: http://localhost:3000
    entrypoint: ["/bin/sh", "/opt/keycloak-config/configure-ssl.sh"]
    networks:
      - app-network
    restart: "on-failure:5"
    volumes:
      - ./keycloak/configure-ssl.sh:/opt/keycloak-config/configure-ssl.sh:ro

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres123@db:5432/medical_reports
      REDIS_URL: redis://:redis123@redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: medical-reports
      KEYCLOAK_CLIENT_ID: medical-reports-client
      KEYCLOAK_CLIENT_SECRET: dev-secret
      CORS_ORIGIN: http://localhost:3001
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:3000
        REACT_APP_KEYCLOAK_URL: http://localhost:8080
        REACT_APP_KEYCLOAK_REALM: medical-reports
        REACT_APP_KEYCLOAK_CLIENT_ID: medical-reports-client
    ports:
      - "3001:80"
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: lscr.io/linuxserver/nginx:latest
    container_name: nginx
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - NGINX_AUTORELOAD= #optional
      - NGINX_AUTORELOAD_WATCHLIST= #optional
    volumes:
      - ./nginx_config:/config
    ports:
      - 80:80
      - 443:443
    networks:
      - app-network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
